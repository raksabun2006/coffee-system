plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kh'
version = '0.0.1-SNAPSHOT'

ext['lombok.version'] = '1.18.40'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Standard Web & Validation (MVC)
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Replace 'spring-boot-starter-webflux' with only the reactor-netty client library if using WebClient:
	// (Or remove entirely if using RestClient / RestTemplate)
// Apache POI for Excel (.xlsx)
	implementation 'org.apache.poi:poi-ooxml:5.2.5'

	// OpenPDF for clean PDF generation
	implementation 'com.github.librepdf:openpdf:1.3.39'

	// Database & Flyway
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// Security & Keycloak
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.keycloak:keycloak-admin-client:26.0.0'

	// Swagger / OpenAPI Documentation
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.fork = true
	options.forkOptions.jvmArgs += [
			'--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
			'--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
			'--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
			'--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED',
			'--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
			'--add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
			'--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
			'--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
			'--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
			'--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
	]
}

tasks.named('test') {
	useJUnitPlatform()
}